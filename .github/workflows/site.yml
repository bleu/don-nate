name: site

on:
  push:
    branches: [main]
    paths: ["site/**"]
  pull_request:
    paths: ["site/**"]

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
      - run: npm run build
      # e2e specs hit the live testnet contract (see cypress/e2e/browse.cy.ts) — deliberately
      # not run in CI to avoid flaking on third-party network/RPC availability. Run locally
      # via `npm run e2e` before merging anything that touches contract-facing code.
